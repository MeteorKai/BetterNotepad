[package]
name = "notepad-app"
version = "0.3.3"
description = "A beautiful notepad application"
authors = ["you"]
edition = "2021"

[lib]
name = "notepad_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
tauri-plugin-opener = "2"
# Pseudo-terminal for the "run in a real terminal" output mode. Gives the child
# a ConPTY on Windows / openpty elsewhere, so it stops block-buffering and emits
# ANSI sequences we can render with xterm.js.
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
# Explorer context-menu integration. Already in the tree as a transitive
# dependency, so declaring it directly costs nothing extra to build.
winreg = "0.55"
# Job objects: ConPTY's kill only terminates the direct child, leaving
# grandchildren (e.g. something the script spawned with subprocess) orphaned.
# A job with KILL_ON_JOB_CLOSE makes the kernel clean up the whole tree when we
# drop the handle. Declared directly because we use these APIs ourselves.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
