[package]
name = "notepad-app"
version = "0.5.1"
description = "A beautiful notepad application"
authors = ["you"]
edition = "2021"

[lib]
name = "notepad_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
# Local wall-clock time for run-log file names, so a directory listing reads as
# a timeline. Already in the tree as a transitive dependency, so declaring it
# directly costs nothing extra to build.
chrono = "0.4"
tauri-plugin-opener = "2"
# Pseudo-terminal for the "run in a real terminal" output mode. Gives the child
# a ConPTY on Windows / openpty elsewhere, so it stops block-buffering and emits
# ANSI sequences we can render with xterm.js.
portable-pty = "0.9"
# Deletions go to the OS trash (Recycle Bin) instead of being removed for good:
# one confirmed click in the file tree must stay reversible.
trash = "5"
tauri-plugin-updater = "~2.12.0"
# Retain HTTP status information when the updater reports an opaque endpoint failure.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
# Explorer context-menu integration. Already in the tree as a transitive
# dependency, so declaring it directly costs nothing extra to build.
winreg = "0.55"
# Job objects: ConPTY's kill only terminates the direct child, leaving
# grandchildren (e.g. something the script spawned with subprocess) orphaned.
# A job with KILL_ON_JOB_CLOSE makes the kernel clean up the whole tree when we
# drop the handle. Declared directly because we use these APIs ourselves.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
